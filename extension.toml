name = "IEC 61850"
version = "0.2.1"
description = "IEC 61850 station bus: a GOOSE subscriber for every control block on a segment, decoded live or from a pcap"
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-iec61850"
homepage = "https://github.com/zeloscloud/zelos-extension-iec61850"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["goose", "iec61850", "iec 61850", "substation", "scl", "scd", "protection", "pcap", "ethernet"]
categories = ["Industrial", "Networking", "IoT"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"
# The platforms zelos-packet ships a wheel for.
targets = ["linux-x86_64", "linux-aarch64", "darwin-arm64", "windows-x86_64"]

# Stopping tears down every capture handle and lets the SDK's atexit hook drain
# the trace pipeline; 15s leaves room for a busy interface's final flush before
# the supervisor escalates to SIGKILL.
[agent.stop]
grace_seconds = 15

# `config.json` ships so a fresh install has sane defaults before the app writes
# its own. The demo capture is inside the package directory already; naming it
# makes the packaging test fail if it goes missing.
[package]
paths = [
    "LICENSE",
    "main.py",
    "zelos_extension_iec61850",
    "zelos_extension_iec61850/demo/goose-demo.pcap",
    "config.json",
]
